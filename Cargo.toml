[package]
name = "mod-worldguard"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
toml = "=1.1.6"


[features]
# Code for the engine branches fam-worldguard-gameplay-cancels (mob_effect_apply_cancel, player_oversize_stack,
# living_incoming_damage_detail) and fam-diagnostics-profiler (profiler_start/report/stop, event_trace_*), which the
# mod SDK does not have yet. Off by default; written from the drafts, not compiled against them.
wave2 = []
