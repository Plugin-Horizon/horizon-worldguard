id = "worldguard"
name = "WorldGuard"
version = "0.1.0"
description = "Region protection (WorldGuard rules and /rg, /wg commands) for Horizon servers, as a native trait mod."
authors = ["Plugin-Horizon contributors"]
api = "0.2"
capabilities = ["registries"]
# The Java plugin's WorldEdit dependency (selections for /rg define, redefine, claim, select, -s). The launcher adds the
# `worldedit` Cargo alias (the worldedit trait mod); do not declare it in Cargo.toml.
[dependencies]
worldedit = "^0.1"

[native]
# Development build of arismoko/horizon main plus mod API additions (see README).
game = "26.3"
horizon = "54090ee36c4e2c7b43b66db864220c577b94b7e0"
mixins = "5a64af938ec86b00d53d16a408aabc0038fb3e57"
